<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ask Winthorpe</title>
  <meta name="description" content="Ask questions about the Agent Winthorpe architecture.">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main class="shell">
    <header>
<div class="brand">
  <img src="/logo.png" alt="Agent Winthorpe">
</div>
<section id="chat" class="chat" aria-live="polite"></section>
    <form id="form" class="composer">
      <label class="sr-only" for="question">Ask about Winthorpe</label>
      <textarea id="question" rows="2" maxlength="1500" placeholder="Ask a question about the architecture…" required></textarea>
      <button id="send" type="submit" aria-label="Send">
        <img src="/arrow.png" alt="">
      </button>
    </form>
    <p class="note">Answers are generated from Winthorpe's <a href="https://docs.agentwinthorpe.com" target="_blank" rel="noopener noreferrer">architecture reference</a>.</p>
  </main>
  <script src="script.js?v=2"></script>
</body>
</html>
